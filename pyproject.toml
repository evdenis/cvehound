[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cvehound"
version = "1.3.0"
description = "A tool to check linux kernel source dump for known CVEs"
readme = "README.md"
license = {text = "GPLv3"}
authors = [{name = "Denis Efremov", email = "efremov@linux.com"}]
requires-python = ">=3.11"
keywords = ["cve", "linux", "kernel", "spatch", "cve-scanning", "coccinelle"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["sympy", "pyyaml"]

[project.scripts]
cvehound = "cvehound.__main__:main"
cvehound_update_metadata = "cvehound.scripts.update_metadata:main"
cvehound_update_rules = "cvehound.scripts.update_rules:main"

[project.urls]
Homepage = "http://github.com/evdenis/cvehound"

[dependency-groups]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
]
test = ["pytest", "gitpython", "psutil"]
lint = [
    "ruff>=0.15.10",
    "ty>=0.0.29",
    "pre-commit>=4.0",
]

[tool.setuptools.packages.find]
include = ["cvehound", "cvehound.*"]

[tool.setuptools.package-data]
"*" = ["*.cocci", "*.grep", "*.gz"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ANN"]
ignore = [
    "E501",
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"cvehound/kbuild.py" = ["ANN"]
"cvehound/kbuildparse/**" = ["ANN"]

[tool.ruff.format]
quote-style = "single"

[tool.ty.environment]
python-version = "3.11"
python-platform = "linux"

[tool.ty.src]
include = ["cvehound"]
exclude = [
    "tests",
    "build",
    "dist",
    "cvehound.egg-info",
    "cvehound/kbuild.py",
    "cvehound/kbuildparse",
]
