[pytest]
pythonpath = tests
minversion = 6.0
norecursedirs = linux
addopts = -rA --show-capture=stderr --strict-markers --tb=short -n auto --dist loadgroup
testpaths =
    tests
markers =
    slow: mark test as slow to run
    fast: fast tests that are duplicated by slow ones
    notbackported: mark test as failed
    ownfixes: mark test as failed
    nometadata: mark test as failed
    metadata: check kernel_cves.json against the kernel git tree
    kernel_history(*route): full-tree test at a branch head (ordered per branch; one xdist group when worktrees are off)
